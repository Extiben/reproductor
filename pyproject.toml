[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localtune"
version = "0.1.0"
description = "Reproductor de música local ligero basado en Qt"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.6,<7",
  "mutagen>=1.47,<2",
]

[tool.setuptools]
packages = ["localtune"]
